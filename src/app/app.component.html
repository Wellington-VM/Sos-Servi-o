<ion-app>
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-title class="logo-container">
          <img src="assets/icon/sos_serviços.svg" alt="" class="header-logo">
        </ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <div class="user-info">
        <ion-avatar class="avatar-menu">
          <img [src]="usuario.foto" [alt]="usuario.nome">
        </ion-avatar>
        <h2 class="nome-usuario">{{ usuario.nome }}</h2>
        <ion-badge>{{ userService.tipoUsuario() === 'profissional' ? 'Profissional' : 'Cliente' }}</ion-badge>
        <p class="text-info">{{ usuario.email }}</p>
      </div>

      <ion-list>
        <ion-menu-toggle autoHide="true">
          <ion-item button (click)="userService.alternarVisao()">
            <ion-icon name="construct" slot="start"></ion-icon>
            <ion-label>
              Mudar para Visão {{ userService.tipoUsuario() === 'cliente' ? 'Profissional' : 'Cliente' }}
            </ion-label>
          </ion-item>
        </ion-menu-toggle>
        <ion-menu-toggle autoHide="true">
          <ion-item [routerLink]="['/login']">
            <ion-icon name="log-out" slot="start"></ion-icon>
            <ion-label>Sair da conta</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
