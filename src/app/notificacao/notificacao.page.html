<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>

    <ion-title>Notificação</ion-title>

    <ion-buttons slot="end">
      <ion-button disabled style="opacity: 0">
        <ion-icon name="arrow-back-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card class="card-notificacao">
    @for (notif of notificacoes; track notif.id) {
    <ion-card-content [class.nao-lida]="!notif.lida">
      <div class="card">
        <ion-avatar class="avatar-profissional">
          <img [src]="notif.avatar" [alt]="notif.nome" />
        </ion-avatar>

        <div class="info-principal">
          <p><strong>{{ notif.nome }}</strong> {{ notif.mensagem }}</p>
          <span class="tempo-notificacao">{{ notif.tempo }}</span>
        </div>
      </div>
    </ion-card-content>
    }
  </ion-card>
</ion-content>
